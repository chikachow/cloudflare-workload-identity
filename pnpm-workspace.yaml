packages:
  - "packages/*"
  - "workers/*"

# Conditional overrides retire when upstream moves off these affected pins.
overrides:
  # https://github.com/advisories/GHSA-mrhx-c7xc-m3w5
  "zod@4.6.5": "4.6.7"
  # https://github.com/nodejs/undici/releases/tag/v7.30.1
  "undici@7.29.1": "7.30.1"

minimumReleaseAgeExclude:
  - "@cloudflare/workerd-darwin-64@1.20260907.1"
  - "@cloudflare/workerd-darwin-arm64@1.20260907.1"
  - "@cloudflare/workerd-linux-64@1.20260907.1"
  - "@cloudflare/workerd-linux-arm64@1.20260907.1"
  - "@cloudflare/workerd-windows-64@1.20260907.1"

autoInstallPeers: false
strictPeerDependencies: false
engineStrict: true
minimumReleaseAge: 4320

# Explicit version selection and CI enforce the manifest pin; keep GitHub-compatible lockfiles.
pmOnFail: ignore
autoDedupe: true
lockfile:
  includeResolutionSettings: true
verifyDepsBeforeRun: error

allowBuilds:
  esbuild: false
  workerd: false
strictDepBuilds: true
