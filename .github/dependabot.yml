version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Sydney
    open-pull-requests-limit: 10
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Sydney
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      cloudflare-workers-sdk:
        patterns:
          - "@cloudflare/vitest-pool-workers"
          - wrangler
      oxc-tooling:
        patterns:
          - oxfmt
          - oxlint
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
